name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # cpal links against ALSA on Linux.
      - name: Install ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      # Binary only: the integration tests pull in modules with #[path], so
      # items the binary uses look dead to each test crate.
      - run: cargo clippy -- -D warnings
      - run: cargo test
      # Build the package exactly as crates.io would receive it, so a missing
      # `include` entry fails here and not at release time.
      - run: cargo package

  # The web editor's wasm crate shares src/ through #[path], so a change there
  # can break it without touching web/.
  web:
    name: web editor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web/wasm
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.128
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cargo fmt --manifest-path web/wasm/Cargo.toml --check
      - run: cargo clippy --manifest-path web/wasm/Cargo.toml --target wasm32-unknown-unknown -- -D warnings
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
